AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Library Management System

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name
  
  TableName:
    Type: String
    Default: lms-table
    Description: DynamoDB table name

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.11
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref LibraryTable
        ENVIRONMENT: !Ref Environment
    Layers:
      - !Ref CommonLayer

Resources:
  # DynamoDB Table
  LibraryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TableName}-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: LibraryManagementSystem

  # Lambda Layer for common dependencies
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "lms-common-layer-${Environment}"
      Description: Common dependencies for LMS
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Delete

  # API Gateway
  LibraryApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "lms-api-${Environment}"
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"

  # Books Lambda Function
  BooksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lms-books-${Environment}"
      CodeUri: src/
      Handler: application.lambda_handlers.books_handler_simple.lambda_handler
      Description: Handle books operations
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LibraryTable
      Events:
        ListBooks:
          Type: Api
          Properties:
            RestApiId: !Ref LibraryApi
            Path: /books
            Method: GET
        CreateBook:
          Type: Api
          Properties:
            RestApiId: !Ref LibraryApi
            Path: /books
            Method: POST
        GetBook:
          Type: Api
          Properties:
            RestApiId: !Ref LibraryApi
            Path: /books/{book_id}
            Method: GET
        SearchBooks:
          Type: Api
          Properties:
            RestApiId: !Ref LibraryApi
            Path: /search
            Method: GET
        AutocompleteBooks:
          Type: Api
          Properties:
            RestApiId: !Ref LibraryApi
            Path: /autocomplete
            Method: GET

  # Loans Lambda Function
  LoansFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lms-loans-${Environment}"
      CodeUri: src/
      Handler: application.lambda_handlers.loans_handler.lambda_handler
      Description: Handle loans operations
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LibraryTable
      Events:
        ListLoans:
          Type: Api
          Properties:
            RestApiId: !Ref LibraryApi
            Path: /loans
            Method: GET
        CreateLoan:
          Type: Api
          Properties:
            RestApiId: !Ref LibraryApi
            Path: /loans
            Method: POST
        GetLoan:
          Type: Api
          Properties:
            RestApiId: !Ref LibraryApi
            Path: /loans/{loan_id}
            Method: GET
        ReturnLoan:
          Type: Api
          Properties:
            RestApiId: !Ref LibraryApi
            Path: /loans/{loan_id}/return
            Method: PUT

  # S3 Bucket for static website
  StaticWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "lms-static-${Environment}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # S3 Bucket Policy for public read access
  StaticWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticWebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub "${StaticWebsiteBucket}/*"

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${LibraryApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  WebsiteUrl:
    Description: Static website URL
    Value: !GetAtt StaticWebsiteBucket.WebsiteURL
    Export:
      Name: !Sub "${AWS::StackName}-WebsiteUrl"

  DynamoDBTable:
    Description: DynamoDB table name
    Value: !Ref LibraryTable
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDBTable"

  S3Bucket:
    Description: S3 bucket name for static website
    Value: !Ref StaticWebsiteBucket
    Export:
      Name: !Sub "${AWS::StackName}-S3Bucket"