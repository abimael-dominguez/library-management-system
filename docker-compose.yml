services:
  # Test runner
  test:
    build: .
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./htmlcov:/app/htmlcov
    environment:
      - PYTHONPATH=/app:/app/src
    command: pytest -v --cov=src --cov-report=term-missing --cov-report=html

  # DynamoDB Local for integration tests
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: lms-dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

  # Local API for testing
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PYTHONPATH=/app:/app/src
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_TABLE=lms-table-local
    depends_on:
      - dynamodb-local
    command: python -m src.local.api_server
    volumes:
      - ./src:/app/src
