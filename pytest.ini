[tool:pytest]
testpaths = tests/unit tests/functional
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src/application
    --cov=src/domain
    --cov=src/infrastructure
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=75

markers =
    unit: Unit tests
    functional: Functional tests
    slow: Slow running tests
